<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><script type="application/ld+json">{"@context":"http://schema.org/","@type":"JobPosting","title":"Research Assistant (Ref. LAB/26/17)","description":"\u003ch5\u003eYour Role \u0026amp; Our Team\u003c/h5\u003e\u003cp\u003e\u003cspan\u003eIRB Barcelona is seeking a dedicated Research Assistant to support our research teams. The successful candidate will support experimental studies using mouse models and molecular and cellular approaches to understand the lasting consequences of physiological transitions on hematopoietic stem cells.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan\u003eThis position is linked to the \"Physiological history as the architect of blood stem cell clonality\" project.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003ch6\u003e\u003cstrong\u003eKEY RESPONSIBILITIES\u0026nbsp;\u003c/strong\u003e\u003c/h6\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan\u003eSupport mouse experiments, including sample collection and processing.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan\u003eIsolate and prepare bone marrow and hematopoietic cell populations for downstream experiments.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan\u003ePerform flow cytometry staining and analysis, and assist with cell sorting and HSC phenotyping.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan\u003eAssist with lineage-tracing (DARLIN mice model) and single-cell experiments, including accurate sample tracking and documentation.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan\u003eHelp coordinate experiments, maintain laboratory records, and follow animal welfare\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan\u003eAssist researchers with experiments and projects.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eYOU HAVE\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan\u003eMaster’s degree in Biology, Biomedical Sciences, Molecular Biology, Biotechnology, or a related discipline.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan\u003eExperience in molecular and cellular biology techniques and familiarity with good laboratory practices.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan\u003eStrong organizational skills and ability to plan experiments and manage samples carefully.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan\u003eAttention to detail, reliable record keeping, and a rigorous approach to experimental work.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan\u003eProficiency in English (both written and spoken).\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan\u003eExcellent interpersonal and communication skills.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan\u003eHighly motivated and collaborative person.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan\u003eWilling to keep on learning.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan\u003eAbility to work independently in a demanding research environment.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eYOU MIGHT ALSO HAVE\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan\u003eExperience with mouse models, bone marrow processing, or hematopoietic stem and progenitor cells.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan\u003eFamiliarity with lineage tracing, single-cell technologies, or basic analysis using FlowJo\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan\u003eExperience with multicolor flow cytometry, cell sorting, or molecular assays\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWHAT WE OFFER:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eTo be a part a part of something meaningful: \u003c/strong\u003eWe are a biomedical research centre that tirelessly works to achieve a society free of diseases. Our mission is to carry out research of excellence to cure cancer and other diseases linked to ageing.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eGood Working conditions: \u003c/strong\u003e\u003cem\u003e3-year temporary contract linked to \u003c/em\u003e\u003cspan\u003e\u003cem\u003ethe \"Physiological history as the architect of blood stem cell clonality\" project.\u003c/em\u003e\u003c/span\u003e Employed in compliance with Spanish legislation and regulations under a full-time contract. Employees receive the benefits of the Spanish Social Security system covering sickness, maternity/paternity leave and injuries at work.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eCompetitive salary: \u003c/strong\u003ecommensurate with experience and qualifications.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eInternational Environment: \u003c/strong\u003ewe are home to nearly 500 researchers, technical and support staff from 45 countries.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMultidisciplinary Research: \u003c/strong\u003eResearch of excellence at the unique interface between biology, chemistry, and structural and computational biology.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eContinuous Training:\u003c/strong\u003e Transversal and general training is offered to our community (examples include research seminars, conferences, training in time management, scientific integrity, gender equality, health and safety, languages courses and emotional wellbeing).\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eRelocation \u0026amp; Visa Assistance: \u003c/strong\u003eTrained staff provides support on visa paperwork, administrative requirements, and practical information on living and working in Barcelona, etc.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eSocial Life: \u003c/strong\u003eWe like to have fun. We promote several activities, like a Football League, an annual skiing trip, a Mountaineering Club, a Running Club and \"Cool-off sessions\", where members meet informally for drinks, snacks and scientific discussions.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eFairness: \u003c/strong\u003eOur recruitment is open, transparent and merit-based, and all applicants compete on the same terms. We are an Equal Opportunity Employer and all qualified applicants are considered for employment without regard to race, colour, religion, age, sex, sexual orientation, gender identity, nationality, ethnic origin or disability.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eHOW TO APPLY \u0026amp; SELECTION PROCESS:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eDeadline for applications\u003c/strong\u003e: \u003cem\u003e23/11/2026\u003c/em\u003e (If no suitable candidate is found, the deadline will be extended)\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eNumber of positions available\u003c/strong\u003e: \u003cem\u003e1\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSelection process:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePre-selection\u003c/strong\u003e: Will be based on CV, motivation letter \u0026amp; experience.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eInterviews\u003c/strong\u003e: Short-listed candidates will be interviewed.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eJob offer\u003c/strong\u003e: Will be sent to the successful candidate after the interview.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eIRB BARCELONA endorses the Requirements and Principles of the European Charter for Researchers, the Code of Conduct for the Recruitment of Researchers, and Open, Transparent, Merit-based recruitment promoted by the European Commission and follows Equal Opportunities policies.\u003c/p\u003e\u003cp\u003eOn 9 December, 2014, IRB Barcelona was awarded the \"HR Excellence in Research\" logo. This recognition reflects the commitment of the Institute to the continuous improvement of its human resources policies in line with the Charter \u0026amp; Code. The Institute works to ensure fair and transparent recruitment and appraisal procedures.\u003c/p\u003e\u003cp\u003ePlease check our \u003ca target=\"_blank\" href=\"https://www.irbbarcelona.org/sites/default/files/2025-09/POL-HR-2_Open_transparent_and_merit-based_Recruitment_OTM-R_Policy.pdf\"\u003eRecruitment Policy\u003c/a\u003e.\u003c/p\u003e\u003cp\u003e\u003cem\u003eNote: The strengths and weaknesses of the applications will be provided upon request.\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eABOUT IRB BARCELONA,\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eCreated in 2005 by the Generalitat de Catalunya (Government of Catalonia) and the University of Barcelona, IRB Barcelona, a Severo Ochoa Centre of Excellence since the first call in 2011, has received the accreditation four consecutive times.\u003c/p\u003e\u003cp\u003eThe institute is devoted to conducting research of excellence in biomedicine and to transferring results to clinical practice, thus improving people’s quality of life, while simultaneously promoting the training of outstanding researchers, technology transfer, and public communication of science. Its 27 laboratories and 9 core facilities address basic questions in biology and are oriented towards diseases such as cancer, metastasis, Alzheimer’s, diabetes, and rare conditions.\u003c/p\u003e\u003cp\u003eIRB Barcelona is an international centre that hosts 500 members from 45 nationalities. It is located in the Barcelona Science Park. IRB Barcelona forms part of the Barcelona Institute of Science and Technology (BIST) and the “Xarxa de Centres de Recerca de Catalunya” (CERCA).\u003cbr\u003e\u003c/p\u003e","identifier":{"@type":"PropertyValue","name":"IRB Barcelona","value":"8615040"},"datePosted":"2026-10-26T12:57:41+01:00","employmentType":"FULL_TIME","directApply":true,"hiringOrganization":{"@type":"Organization","name":"IRB Barcelona","sameAs":"https://recruitment.irbbarcelona.org","logo":"https://images.teamtailor-cdn.com/images/s3/teamtailor-production/logotype-v3/image_uploads/9055bcd2-6cd0-4707-8830-4e3b81e8d35b/original.jpeg"},"jobLocation":[{"@type":"Place","address":{"streetAddress":"IRB Barcelona - Institute for Research in Biomedicine","addressLocality":"Barcelona","postalCode":"08028","addressCountry":"ES","addressRegion":null,"@type":"PostalAddress"}}]}</script></head><body><main><h1>Research Assistant (Ref. LAB/26/17)</h1></main></body></html>
