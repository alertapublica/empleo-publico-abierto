name: Workers

# Workers de Cloudflare (worker/: cron de la ingesta; avisos/: Telegram y correo): tests y validación
# en cada PR; despliegue al fusionar en main.
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "avisos/**"
      - ".github/workflows/worker.yml"
  pull_request:
    paths:
      - "worker/**"
      - "avisos/**"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests
        run: node --test test/index.test.mjs
      - name: Validar la configuración
        run: npx --yes wrangler@4.147.0 deploy --dry-run
      - name: Desplegar
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.147.0 deploy

  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: avisos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"  # node:sqlite para la D1 de los tests
      - name: Tests
        run: node --test test/avisos.test.mjs
      - name: Validar la configuración
        run: npx --yes wrangler@4.147.0 deploy --dry-run
      - name: Migrar D1 y desplegar
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.147.0 d1 migrations apply empleo-avisos --remote
          npx --yes wrangler@4.147.0 deploy
      # Registra el webhook y los comandos del bot. Sin TELEGRAM_TOKEN en el worker responde 409 y
      # no es un fallo: el bot se activa en el siguiente despliegue (o lanzando este workflow a mano).
      - name: Configurar el bot de Telegram
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          AVISOS_CLAVE: ${{ secrets.AVISOS_CLAVE }}
        run: |
          if [ -z "$AVISOS_CLAVE" ]; then echo "Falta el secreto AVISOS_CLAVE."; exit 0; fi
          codigo=$(curl -sS -o respuesta.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $AVISOS_CLAVE" https://empleo-avisos.empleo-publico.workers.dev/interno/configurar)
          cat respuesta.json; echo
          case "$codigo" in
            200) jq -e '.webhook and .comandos' respuesta.json ;;
            409) echo "El bot aún no tiene token: se configurará más adelante." ;;
            *) exit 1 ;;
          esac
